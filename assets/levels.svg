<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 352" width="830" height="352" role="img" aria-label="Level select: Extract, Transform, Load, Serve"><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.up{animation:up .7s ease-out backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.node{animation:lit 8s linear infinite}
@keyframes lit{0%,14%{stroke:#38bdf8;fill:#0e3550}24%,100%{stroke:#2a2f3a;fill:#1b1d23}}
.lcard{animation:litc 8s linear infinite}
@keyframes litc{0%,14%{stroke:#38bdf8}24%,100%{stroke:#2a2f3a}}
.packet{animation:go 8s linear infinite}
@keyframes go{0%{transform:translateX(0);opacity:1}75%{transform:translateX(585px);opacity:1}82%,100%{transform:translateX(585px);opacity:0}}
</style><defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".03"/></pattern>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="829" height="351" rx="14" fill="#131417" stroke="#2a2f3a"/>
<rect x=".5" y=".5" width="829" height="351" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="829" height="351" rx="14" fill="url(#scan)"/><g fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity=".8"><path d="M14 28V14H28"/><path d="M802 14H816V28"/><path d="M14 324V338H28"/><path d="M802 338H816V324"/></g><text x="40" y="46" font-size="15" font-weight="700" letter-spacing="3" fill="#38bdf8">▶ LEVEL SELECT</text><text x="790" y="46" font-size="12" text-anchor="end" fill="#8b93a3">the inputs are never clean</text><path d="M122.5 100H707.5" stroke="#2a2f3a" stroke-width="4" stroke-dasharray="2 8" stroke-linecap="round"/><rect class="lcard" style="animation-delay:0s" x="30.5" y="140" width="184" height="190" rx="10" fill="#1b1d23" stroke="#2a2f3a" stroke-width="1.5"/><circle class="node" style="animation-delay:0s" cx="122.5" cy="100" r="24" fill="#1b1d23" stroke="#2a2f3a" stroke-width="3"/><text x="122.5" y="107" font-size="20" font-weight="700" text-anchor="middle" fill="#e6e8ee">1</text><text x="122.5" y="168" font-size="10" letter-spacing="2" text-anchor="middle" fill="#8b93a3">LEVEL 1</text><text x="122.5" y="192" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#e6e8ee">EXTRACT</text><text x="122.5" y="218" font-size="11.5" text-anchor="middle" fill="#8b93a3">Boundary files, scheme</text><text x="122.5" y="234" font-size="11.5" text-anchor="middle" fill="#8b93a3">PDFs, fund data. Checks</text><text x="122.5" y="250" font-size="11.5" text-anchor="middle" fill="#8b93a3">surface problems at</text><text x="122.5" y="266" font-size="11.5" text-anchor="middle" fill="#8b93a3">the door.</text><path d="M42.5 292H202.5" stroke="#2a2f3a"/><text x="122.5" y="312" font-size="10.5" text-anchor="middle" fill="#38bdf8">GeoJSON · PDF · Python</text><rect class="lcard" style="animation-delay:2s" x="225.5" y="140" width="184" height="190" rx="10" fill="#1b1d23" stroke="#2a2f3a" stroke-width="1.5"/><circle class="node" style="animation-delay:2s" cx="317.5" cy="100" r="24" fill="#1b1d23" stroke="#2a2f3a" stroke-width="3"/><text x="317.5" y="107" font-size="20" font-weight="700" text-anchor="middle" fill="#e6e8ee">2</text><text x="317.5" y="168" font-size="10" letter-spacing="2" text-anchor="middle" fill="#8b93a3">LEVEL 2</text><text x="317.5" y="192" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#e6e8ee">TRANSFORM</text><text x="317.5" y="218" font-size="11.5" text-anchor="middle" fill="#8b93a3">5 surveys, 3 rounds,</text><text x="317.5" y="234" font-size="11.5" text-anchor="middle" fill="#8b93a3">one schema. PySpark and</text><text x="317.5" y="250" font-size="11.5" text-anchor="middle" fill="#8b93a3">Hadoop lift, Polars and</text><text x="317.5" y="266" font-size="11.5" text-anchor="middle" fill="#8b93a3">DuckDB shape + validate.</text><path d="M237.5 292H397.5" stroke="#2a2f3a"/><text x="317.5" y="312" font-size="10.5" text-anchor="middle" fill="#38bdf8">PySpark · Polars · DuckDB</text><rect class="lcard" style="animation-delay:4s" x="420.5" y="140" width="184" height="190" rx="10" fill="#1b1d23" stroke="#2a2f3a" stroke-width="1.5"/><circle class="node" style="animation-delay:4s" cx="512.5" cy="100" r="24" fill="#1b1d23" stroke="#2a2f3a" stroke-width="3"/><text x="512.5" y="107" font-size="20" font-weight="700" text-anchor="middle" fill="#e6e8ee">3</text><text x="512.5" y="168" font-size="10" letter-spacing="2" text-anchor="middle" fill="#8b93a3">LEVEL 3</text><text x="512.5" y="192" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#e6e8ee">LOAD</text><text x="512.5" y="218" font-size="11.5" text-anchor="middle" fill="#8b93a3">Staging in, facts out.</text><text x="512.5" y="234" font-size="11.5" text-anchor="middle" fill="#8b93a3">PostgreSQL warehouse on</text><text x="512.5" y="250" font-size="11.5" text-anchor="middle" fill="#8b93a3">5.2M+ records, dim and</text><text x="512.5" y="266" font-size="11.5" text-anchor="middle" fill="#8b93a3">fact tables.</text><path d="M432.5 292H592.5" stroke="#2a2f3a"/><text x="512.5" y="312" font-size="10.5" text-anchor="middle" fill="#38bdf8">PostgreSQL · Flask · SQL</text><rect class="lcard" style="animation-delay:6s" x="615.5" y="140" width="184" height="190" rx="10" fill="#1b1d23" stroke="#2a2f3a" stroke-width="1.5"/><circle class="node" style="animation-delay:6s" cx="707.5" cy="100" r="24" fill="#1b1d23" stroke="#2a2f3a" stroke-width="3"/><text x="707.5" y="107" font-size="20" font-weight="700" text-anchor="middle" fill="#e6e8ee">4</text><text x="707.5" y="168" font-size="10" letter-spacing="2" text-anchor="middle" fill="#8b93a3">LEVEL 4</text><text x="707.5" y="192" font-size="17" font-weight="700" letter-spacing="1" text-anchor="middle" fill="#e6e8ee">SERVE</text><text x="707.5" y="218" font-size="11.5" text-anchor="middle" fill="#8b93a3">KPI dashboards with</text><text x="707.5" y="234" font-size="11.5" text-anchor="middle" fill="#8b93a3">drill-downs. AIV Hub on</text><text x="707.5" y="250" font-size="11.5" text-anchor="middle" fill="#8b93a3">AWS-hosted servers,</text><text x="707.5" y="266" font-size="11.5" text-anchor="middle" fill="#8b93a3">setup to monitoring.</text><path d="M627.5 292H787.5" stroke="#2a2f3a"/><text x="707.5" y="312" font-size="10.5" text-anchor="middle" fill="#38bdf8">Tableau · AIV Hub · AWS</text><g class="packet"><circle cx="122.5" cy="100" r="14" fill="#38bdf8" fill-opacity=".18"/><circle cx="122.5" cy="100" r="6" fill="#38bdf8"/></g></svg>