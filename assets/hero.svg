<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 290" width="830" height="290" role="img" aria-label="Dharmesh Kashyap, Data Engineer. Raw data in. Decision-ready assets out."><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.up{animation:up .7s ease-out backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

</style><defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".03"/></pattern>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="829" height="289" rx="14" fill="#131417" stroke="#2a2f3a"/>
<rect x=".5" y=".5" width="829" height="289" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="829" height="289" rx="14" fill="url(#scan)"/><g fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity=".8"><path d="M14 28V14H28"/><path d="M802 14H816V28"/><path d="M14 262V276H28"/><path d="M802 276H816V262"/></g><text x="40" y="44" font-size="12" letter-spacing="2" fill="#8b93a3">01 / MAKING DATA USEFUL AT SCALE</text><circle cx="538" cy="40" r="5" fill="#4ade80" class="pulse"/><text x="790" y="44" font-size="12" letter-spacing="1.5" text-anchor="end" fill="#4ade80">OPEN TO DATA ENGINEER ROLES</text><text class="up" style="animation-delay:.2s" x="40" y="108" font-size="40" font-weight="700" fill="#e6e8ee">Raw data in.</text><text class="up" style="animation-delay:.8s" x="40" y="156" font-size="40" font-weight="700" fill="url(#g)">Decision-ready assets out.</text><rect class="blink" x="672" y="126" width="16" height="34" fill="#38bdf8"/><path d="M40 186H790" stroke="#2a2f3a"/><g class="up" style="animation-delay:1.4s"><text x="40" y="214" font-size="11" letter-spacing="2" fill="#8b93a3">PLAYER</text><text x="126" y="214" font-size="16" font-weight="700" fill="#e6e8ee">Dharmesh Kashyap</text></g><g class="up" style="animation-delay:1.5499999999999998s"><text x="40" y="250" font-size="11" letter-spacing="2" fill="#8b93a3">CLASS</text><text x="126" y="250" font-size="16" font-weight="700" fill="#e6e8ee">Data Engineer</text></g><g class="up" style="animation-delay:1.7s"><text x="430" y="214" font-size="11" letter-spacing="2" fill="#8b93a3">GUILD</text><text x="516" y="214" font-size="16" font-weight="700" fill="#e6e8ee">Seamless Digital Automations</text></g><g class="up" style="animation-delay:1.8499999999999999s"><text x="430" y="250" font-size="11" letter-spacing="2" fill="#8b93a3">BASE</text><text x="516" y="250" font-size="16" font-weight="700" fill="#e6e8ee">Mumbai, India</text></g></svg>