<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 120" width="830" height="120" role="img" aria-label="Messy data? Let's talk."><style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'DejaVu Sans Mono',monospace}
.up{animation:up .7s ease-out backwards}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

</style><defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#38bdf8" stroke-opacity=".07"/></pattern>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" fill-opacity=".03"/></pattern>
<linearGradient id="g" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#4ade80"/></linearGradient>
</defs>
<rect x=".5" y=".5" width="829" height="119" rx="14" fill="#131417" stroke="#2a2f3a"/>
<rect x=".5" y=".5" width="829" height="119" rx="14" fill="url(#grid)"/>
<rect x=".5" y=".5" width="829" height="119" rx="14" fill="url(#scan)"/><g fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity=".8"><path d="M14 28V14H28"/><path d="M802 14H816V28"/><path d="M14 92V106H28"/><path d="M802 106H816V92"/></g><text class="blink" x="40" y="68" font-size="30" font-weight="700" fill="#38bdf8">▶</text><text x="78" y="68" font-size="30" font-weight="700" fill="#e6e8ee">Messy data? Let's talk.</text><text x="78" y="96" font-size="13" fill="#8b93a3">Open to Data Engineer roles</text></svg>